<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline - Vend Estates Management System</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="auth-body">
    <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
        <div class="card auth-card shadow-lg border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="auth-logo mb-2">
                    <i class="bi bi-wifi-off"></i>
                </div>
                <h1 class="h4 mb-2">You're Offline</h1>
                <p class="text-muted">
                    Vend Estates Management System can't reach the server right now.
                    Check your internet connection and try again.
                </p>
                <button class="btn btn-primary" onclick="window.location.reload()">
                    <i class="bi bi-arrow-clockwise"></i> Retry
                </button>
            </div>
        </div>
    </div>
</body>
</html>
